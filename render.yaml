services:
  - type: web
    runtime: node
    name: photosense-ai
    buildCommand: npm ci --include=dev && npm run build
    startCommand: npm start
    envVars:
      - key: NODE_VERSION
        value: 20.19.0
      - key: NODE_ENV
        value: production
      - key: ENABLE_HISTORY_EXPORT
        value: "false"
      - key: VITE_ENABLE_HISTORY_EXPORT
        value: "false"
      - key: OPENAI_RELAY_BASE_URL
        sync: false
      - key: OPENAI_RELAY_API_KEY
        sync: false
      - key: OPENAI_RELAY_MODEL
        value: gpt-5.6-luna
      - key: IMAGE_RELAY_BASE_URL
        sync: false
      - key: IMAGE_RELAY_API_KEY
        sync: false
      - key: IMAGE_RELAY_MODEL
        sync: false
      - key: IMAGE_RELAY_TIMEOUT_MS
        value: "120000"
      - key: PROVIDER_TIMEOUT_MS
        value: "60000"
      - key: OPENAI_RELAY_TIMEOUT_MS
        value: "90000"
      - key: OPENAI_RELAY_MAX_TOKENS
        value: "3000"
      - key: OPENAI_RELAY_TEMPERATURE
        value: "0.2"
      - key: PREVIEW_RENDER_TIMEOUT_MS
        value: "15000"
